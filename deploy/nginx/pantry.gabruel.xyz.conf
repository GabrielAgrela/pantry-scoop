# Nginx for pantry.gabruel.xyz -> Pantry Scoop container on 127.0.0.1:3210.
# Install:  sudo cp deploy/nginx/pantry.gabruel.xyz.conf /etc/nginx/sites-available/pantry_gabruel_xyz
#           sudo ln -s ../sites-available/pantry_gabruel_xyz /etc/nginx/sites-enabled/
# TLS:      sudo certbot --nginx -d pantry.gabruel.xyz   (after the DNS A record exists)
# A registered OpenAI client must list: https://pantry.gabruel.xyz/auth/callback

server {
    listen 80;
    server_name pantry.gabruel.xyz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name pantry.gabruel.xyz;

    ssl_certificate /etc/letsencrypt/live/pantry.gabruel.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pantry.gabruel.xyz/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Photos are resized in the browser; 6 photos stay well under this.
    client_max_body_size 40m;
    server_tokens off;

    # Published Android build; expose only this APK, never the project directory.
    location = /downloads/pantry-scoop-debug.apk {
        alias /var/www/pantry-scoop/android/pantry-scoop-debug.apk;
        default_type application/vnd.android.package-archive;
        add_header Content-Disposition 'attachment; filename="pantry-scoop-debug.apk"';
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite (not append) so clients can't spoof their address for rate limiting.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 5s;
        proxy_send_timeout 120s;
    }
}

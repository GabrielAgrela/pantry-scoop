<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#fff8f6" />
    <meta name="description" content="Your kitchen, a little happier. Keep your pantry together and find something lovely to cook." />
    <title>Pantry Scoop — Your everyday kitchen companion</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/js/theme.js"></script>
    <script type="module" src="/js/main.js"></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="app-header">
      <a class="brand" href="#stock" aria-label="Pantry Scoop home">
        <img class="brand-jar" src="/assets/scoop-jar.svg" width="32" height="38" alt="" aria-hidden="true" />
        <span>Pantry Scoop</span>
      </a>
      <nav class="tabbar" aria-label="Main navigation" hidden>
        <span class="tab-indicator" aria-hidden="true"></span>
        <button type="button" data-tab="stock" aria-current="page"><span class="nav-emoji" aria-hidden="true">🧺</span><span>Pantry</span></button>
        <button type="button" data-tab="recipes"><span class="nav-emoji" aria-hidden="true">🍝</span><span>Recipes</span></button>
        <button type="button" data-tab="profile"><span class="nav-emoji" aria-hidden="true">🫖</span><span>Kitchen</span></button>
      </nav>
      <div class="header-end"><button type="button" class="icon theme-toggle" aria-label="Switch to dark theme"><svg class="theme-icon-dark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg><svg class="theme-icon-light" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button><div id="account" class="account"></div></div>
    </header>
    <main id="main-content" tabindex="-1">
      <div id="app-loading" class="app-loading" role="status"><img class="loading-friend" src="/assets/scoop-jar.svg" width="76" height="88" alt="" aria-hidden="true" /><p>Getting your kitchen ready…</p><span class="loading-dots" aria-hidden="true"><i></i><i></i><i></i></span></div>
      <section id="view-login" hidden></section>
      <div class="pages" hidden>
        <div class="page"><section id="view-stock" class="view" data-view="stock" aria-label="My pantry"></section></div>
        <div class="page"><section id="view-recipes" class="view" data-view="recipes" aria-label="Recipes"></section></div>
        <div class="page"><section id="view-profile" class="view" data-view="profile" aria-label="My kitchen"></section></div>
      </div>
    </main>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  </body>
</html>

<!doctype html>

  <body>

        <span>Pantry Scoop.</span>

      <nav class="tabbar" aria-label="Main navigation" hidden>
        <button type="button" data-tab="stock" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M7 3h10v4H7ZM7 7h10l2 4v9H5v-9ZM5 11h14"/></svg><span>Pantry</span></button>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Pantry Scoop promo stage</title>
<style>
  @font-face { font-family: 'Nunito'; src: url('/app/assets/fonts/nunito.ttf') format('truetype'); font-weight: 400 900; }
  html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #fff7f1; }
  #stage { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: 'Nunito', sans-serif; }
  canvas.layer { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
  .copy { position: absolute; left: 0; right: 0; text-align: center; white-space: nowrap; }
  .title { top: 132px; font-weight: 900; font-size: 80px; line-height: 1; letter-spacing: -2px; color: var(--ink); }
  .title .word { display: inline-block; margin: 0 .13em; transform-origin: 50% 80%; }
  .title .hot { color: var(--hot); position: relative; }
  .title .hot svg { position: absolute; left: -4%; width: 108%; bottom: -26px; height: 30px; overflow: visible; }
  .title .hot path { fill: none; stroke: var(--hot); stroke-width: 7; stroke-linecap: round; }
  .title .sticker { display: inline-block; font-family: 'Noto Color Emoji'; font-size: 78px; margin-left: .12em; transform-origin: 50% 70%; filter: drop-shadow(0 6px 8px rgb(110 50 80 / .18)); }
  .sub { top: 252px; font-weight: 800; font-size: 40px; color: var(--muted); letter-spacing: -.3px; }
  .sub span { display: inline-block; }
  #phone { position: absolute; left: 0; top: 0; transform-origin: 50% 50%; }
  #phone .body { position: absolute; inset: 0; border-radius: 116px; background: linear-gradient(150deg, #ffd9e3 0%, #f5b7c9 45%, #eaa1b8 100%); box-shadow: inset 0 0 0 4px #925569, inset 6px 8px 0 4px rgb(255 255 255 / .45), inset -6px -8px 0 4px rgb(146 85 105 / .25); }
  #phone .bezel { position: absolute; inset: 14px; border-radius: 102px; background: #241b22; box-shadow: 0 0 0 2px rgb(146 85 105 / .5); }
  #phone .screen { position: absolute; left: 25px; top: 25px; width: 640px; height: 1385px; border-radius: 88px; overflow: hidden; background: #fffaf3; }
  #phone .screen canvas { width: 640px; height: 1385px; display: block; }
  #phone .island { position: absolute; left: 50%; top: 18px; width: 200px; height: 59px; margin-left: -100px; border-radius: 30px; background: #0d0a0c; }
  #phone .glare { position: absolute; inset: 0; border-radius: 88px; background: linear-gradient(118deg, rgb(255 255 255 / .16) 0%, rgb(255 255 255 / 0) 26%, rgb(255 255 255 / 0) 70%, rgb(255 255 255 / .06) 100%); pointer-events: none; }
  #phone .button { position: absolute; width: 8px; border-radius: 4px; background: #e597ad; box-shadow: inset 0 0 0 2px #925569; }
  #shadow { position: absolute; left: 0; top: 0; width: 760px; height: 120px; border-radius: 50%; background: radial-gradient(closest-side, rgb(146 74 104 / .32), rgb(146 74 104 / 0)); }
  #intro, #outro { position: absolute; inset: 0; }
  .scoop svg { display: block; width: 100%; height: 100%; overflow: visible; filter: drop-shadow(0 18px 22px rgb(146 74 104 / .18)); }
  .wordmark { font-weight: 900; font-size: 132px; letter-spacing: -4px; color: var(--ink); }
  #outro .wordmark { font-size: 112px; letter-spacing: -3px; }
  .wordmark span { display: inline-block; transform-origin: 50% 90%; }
  .tagline { font-weight: 800; font-size: 48px; color: var(--hot); letter-spacing: -.5px; }
  .pill { display: inline-block; padding: 14px 30px; border-radius: 999px; font-weight: 800; font-size: 32px; background: rgb(255 255 255 / .1); color: #fff2e9; box-shadow: inset 0 0 0 2px rgb(247 182 205 / .35); }
  .url { color: #d8c1d3; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="bg" class="layer" width="1080" height="1920"></canvas>
  <div id="titles"></div>
  <div id="shadow"></div>
  <div id="phone">
    <div class="body"></div>
    <div class="button" style="left:-4px; top:330px; height:110px"></div>
    <div class="button" style="left:-4px; top:470px; height:110px"></div>
    <div class="button" style="right:-4px; top:400px; height:170px"></div>
    <div class="bezel"></div>
    <div class="screen"><canvas id="screen" width="1170" height="2532"></canvas><div class="island"></div><div class="glare"></div></div>
  </div>
  <canvas id="fx" class="layer" width="1080" height="1920"></canvas>
  <div id="intro"></div>
  <div id="outro"></div>
</div>
<script type="module" src="./compose.js"></script>
</body>
</html>
